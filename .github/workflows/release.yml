name: Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify syntax and run tests
        run: |
          node --check install.mjs
          node --check uninstall.mjs
          npm test

      - name: Build Windows 1-Click GUI Installer (.exe)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-win-exe.ps1 -OutDir dist

      - name: Smoke test Windows installer CLI (--silent-install / --silent-uninstall)
        shell: powershell
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP ("prism-exe-smoke-" + [Guid]::NewGuid().ToString("N"))
          $userDir = Join-Path $tmp "user"
          $pluginsDir = Join-Path $tmp "plugins"
          $exe = "dist\Anti-Claude-Prism-Suite-Setup.exe"
          $p1 = Start-Process -FilePath $exe -ArgumentList @("--silent-install", "--test-user-dir=$userDir", "--test-plugins-dir=$pluginsDir") -Wait -PassThru
          if ($p1.ExitCode -ne 0) { throw "Silent install failed: $($p1.ExitCode)" }
          if (-not (Test-Path (Join-Path $userDir "extensions\prism-suite.js"))) { throw "Missing prism-suite.js" }
          if (-not (Test-Path (Join-Path $userDir "extensions\prism-suite.css"))) { throw "Missing prism-suite.css" }
          if (-not (Test-Path (Join-Path $pluginsDir "prism-files\plugin.json"))) { throw "Missing plugin.json" }
          $p2 = Start-Process -FilePath $exe -ArgumentList @("--silent-uninstall", "--test-user-dir=$userDir", "--test-plugins-dir=$pluginsDir") -Wait -PassThru
          if ($p2.ExitCode -ne 0) { throw "Silent uninstall failed: $($p2.ExitCode)" }
          if (Test-Path (Join-Path $userDir "extensions\prism-suite.js")) { throw "prism-suite.js was not removed" }
          if (Test-Path (Join-Path $pluginsDir "prism-files")) { throw "prism-files was not removed" }
          Remove-Item -LiteralPath $tmp -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/Anti-Claude-Prism-Suite-Setup.exe
            dist/Anti-Claude-Prism-Suite-Setup.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Anti-Claude-Prism-Suite-Setup.exe
            dist/Anti-Claude-Prism-Suite-Setup.exe.sha256
