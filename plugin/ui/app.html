      function renderPreviewHeaderOnly() {
        const pv = appState.preview;
        const data = pv.data;
        if (!pv.visible) return;

        const kind = data?.kind && KIND_ICONS[data.kind] ? data.kind : 'file';
        previewIcon.className = `kind-icon kind-${kind}`;
        previewIcon.innerHTML = KIND_ICONS[kind];
        previewFilename.textContent = data?.name || (pv.loading ? '正在加载…' : '预览');
        previewFilename.title = data?.path || '';
        previewSize.textContent = data?.sizeText || '';

        const isText = data?.previewType === 'text' || data?.previewType === 'markdown';
        const isProtected = data?.previewType === 'protected';
        previewBadgeRo.textContent = isProtected ? '受保护' : '只读';
        previewBadgeRo.hidden = !(data?.ok && (isProtected || (isText && !data.editable)));
        previewBadgeTrunc.hidden = !(data?.ok && data.truncated);
        previewBadgeDirty.hidden = !(pv.editing && pv.dirty);

        const showMdToggle = Boolean(data?.ok && data.previewType === 'markdown' && !pv.editing);
        mdModeGroup.hidden = !showMdToggle;
        btnMdPreview.classList.toggle('is-active', pv.mdMode === 'preview');
        btnMdSource.classList.toggle('is-active', pv.mdMode === 'source');

        const pinned = Boolean(data?.path) && appState.prefs.pinnedPaths.includes(data.path);
        btnPreviewPin.hidden = !data?.path;
        btnPreviewPin.classList.toggle('is-star-active', pinned);
        btnPreviewPin.setAttribute('aria-pressed', pinned ? 'true' : 'false');
        btnPreviewPin.title = pinned ? '取消收藏此文件' : '收藏此文件';

        btnPreviewOpen.hidden = !(data?.uri && !isProtected && !appState.nativeTabUnsupported);
        const canOpenWith = Boolean(data?.path && !isProtected && (!appState.openTargets.loaded || appState.openTargets.items.length > 0));
        btnPreviewOpenWith.hidden = !canOpenWith;
        btnPreviewReveal.hidden = !data?.path;
        btnPreviewCopy.hidden = !(data?.ok && isText && typeof data.text === 'string' && !pv.editing);
        const range = getLineRangeSelection();
        const showQuote = Boolean(data?.path && !isProtected && (appState.hostCapabilities?.updateModelContext || range));
        btnPreviewQuote.hidden = !showQuote;
        btnPreviewQuote.textContent = range
          ? (range.start === range.end ? `引用 L${range.start}` : `引用 L${range.start}-${range.end}`)
          : '引用选段';
        btnPreviewQuote.classList.toggle('is-primary', Boolean(range));

        const canEdit = Boolean(data?.ok && data.editable === true);
        btnPreviewEdit.hidden = !canEdit || pv.editing;
        btnPreviewSave.hidden = !pv.editing;
        btnPreviewCancel.hidden = !pv.editing;

        btnPreviewCollapse.textContent = pv.collapsed ? '▴' : '▾';
        btnPreviewCollapse.title = pv.collapsed ? '展开预览' : '收起预览';
      }

      function renderPreviewDrawer() {
        const pv = appState.preview;
        previewDrawer.hidden = !pv.visible;
        if (!pv.visible) return;

        previewDrawer.classList.toggle('is-collapsed', pv.collapsed);
        if (!pv.collapsed) {
          previewDrawer.style.height = `${pv.height}px`;
        }

        renderPreviewHeaderOnly();
        renderPreviewBanner();

        if (pv.loading) {
          previewBody.innerHTML = '<div class="preview-placeholder">正在读取文件内容…</div>';
          return;
        }

        const data = pv.data;
        if (!data || data.ok === false) {
          previewBody.innerHTML =
            `<div class="preview-placeholder">` +
              `<span>${escapeHtml(data?.error || '无法预览该文件')}</span>` +
              (data?.path ? `<div class="placeholder-actions"><button type="button" class="ctrl-btn" data-placeholder-action="reveal">定位系统目录</button></div>` : '') +
            `</div>`;
          return;
        }

        if (pv.editing) {
          previewBody.innerHTML = '';
          const ta = document.createElement('textarea');
          ta.id = 'editor-textarea';
          ta.className = 'editor-textarea';
          ta.spellcheck = false;
          ta.value = pv.draft;
          ta.addEventListener('input', () => {
            pv.draft = ta.value;
            const nextDirty = pv.draft !== (data.text || '');
            if (nextDirty !== pv.dirty) {
              pv.dirty = nextDirty;
              renderPreviewHeaderOnly();
            }
          });
          previewBody.appendChild(ta);
          ta.focus();
          return;
        }

        if (data.previewType === 'image') {
          const validDataUrl = typeof data.dataUrl === 'string' && /^data:image\/[a-z0-9.+-]+;base64,/i.test(data.dataUrl);
          if (!validDataUrl) {
            previewBody.innerHTML = '<div class="preview-placeholder">图片数据格式无效，无法渲染</div>';
            return;
          }
          previewBody.innerHTML = '';
          const stage = document.createElement('div');
          stage.className = 'image-stage';
          const img = document.createElement('img');
          img.alt = data.name || '图片预览';
          const meta = document.createElement('div');
          meta.className = 'image-meta';
          meta.textContent = `${data.mime || 'image'} · ${data.sizeText || ''}`;
          img.addEventListener('load', () => {
            meta.textContent = `${img.naturalWidth} × ${img.naturalHeight} px · ${data.mime || 'image'} · ${data.sizeText || ''}`;
          });
          img.addEventListener('error', () => {
            meta.textContent = '图片解码失败';
          });
          img.src = data.dataUrl;
          stage.appendChild(img);
          stage.appendChild(meta);
          previewBody.appendChild(stage);
          return;
        }

        if (data.previewType === 'protected') {
          previewBody.innerHTML =
            '<div class="preview-placeholder">' +
              '<span>受保护凭据文件，工作台已禁止预览与编辑</span>' +
              '<div class="placeholder-actions">' +
                '<button type="button" class="ctrl-btn" data-placeholder-action="reveal">在系统目录中定位</button>' +
              '</div>' +
            '</div>';
          return;
        }

        if (data.previewType === 'too_large' || data.previewType === 'binary') {
          const msg = data.previewType === 'too_large'
            ? `图片或文件过大（${data.sizeText}），超出工作台内联预览上限`
            : `二进制文件，不支持文本预览（${data.sizeText}）`;
          const canOpen = Boolean(data.uri && !appState.nativeTabUnsupported);
          previewBody.innerHTML =
            `<div class="preview-placeholder">` +
              `<span>${escapeHtml(msg)}</span>` +
              `<div class="placeholder-actions">` +
                (canOpen ? '<button type="button" class="ctrl-btn is-primary" data-placeholder-action="open">在原生标签页打开</button>' : '') +
                '<button type="button" class="ctrl-btn" data-placeholder-action="reveal">在系统目录中定位</button>' +
              `</div>` +
            `</div>`;
          return;
        }

        if (data.previewType === 'markdown' && pv.mdMode === 'preview') {
          previewBody.innerHTML = `<article class="md-view">${renderMarkdownToHtml(data.text || '')}</article>`;
          return;
        }

        // Source / plain text view with clickable line numbers (click line, Shift+click range -> @path#L10-L25)
        const text = String(data.text ?? '');
        const lineCount = text === '' ? 1 : text.split('\n').length;
        const range = getLineRangeSelection();
        const nums = [];
        for (let n = 1; n <= lineCount; n++) {
          const isSel = Boolean(range && n >= range.start && n <= range.end);
          nums.push(`<span class="code-ln${isSel ? ' is-selected' : ''}" data-line="${n}" title="点击选中行号（Shift+点击选区间）">${n}</span>`);
        }
        previewBody.innerHTML =
          `<div class="code-view">` +
            `<div class="code-gutter" aria-label="代码行号（点击或 Shift+点击选中引用区间）">${nums.join('')}</div>` +
            `<pre class="code-content"><code>${escapeHtml(text)}</code></pre>` +
          `</div>`;
      }

      }

      async function loadAccountsTab({ forceRefresh = false } = {}) {
        const seq = ++appState.accounts.seq;
        appState.accounts.loading = true;
        appState.accounts.error = '';
        setTopProgress(true);
        if (!appState.accounts.data) renderAccounts();
        try {
          const [st, mem] = await Promise.all([
            callServerTool('accounts_status', { forceRefresh: Boolean(forceRefresh) }),
            callServerTool('handoff_memory_list', { limit: 8 }).catch(() => ({ entries: [] }))
          ]);
          if (seq !== appState.accounts.seq) return;
          appState.accounts.data = st || null;
          appState.accounts.memories = Array.isArray(mem?.entries) ? mem.entries : [];
          appState.accounts.loaded = true;
          appState.accounts.loading = false;
          if ((st?.accounts?.length || 0) < 2) {
            appState.accounts.openSections.guide = true;
          }
          broadcastAccountSummary(st);
          setTopProgress(false);
          if (latestBridgeQuota) {
            const curOnline = (st?.accounts || []).find((a) => a.isCurrentActive);
            if (curOnline && !curOnline.effectiveQuota) {
              syncLiveQuotaFromMain(latestBridgeQuota, { force: true });
            }
          }
        } catch (err) {
          if (seq !== appState.accounts.seq) return;
          appState.accounts.loading = false;
          setTopProgress(false);
          appState.accounts.error = err?.message || '读取账号接力状态失败';
        }
        renderAccounts();
      }

      function stopCountdown(clearState = true) {
        if (countdownRaf) {
          cancelAnimationFrame(countdownRaf);
          countdownRaf = null;
        }
        countdownLastSec = -1;
        if (clearState) {
          appState.accounts.countdown = null;
          renderAccounts();
        }
      }

      function formatAccountErrorMessage(errOrMsg, fallback = '操作失败') {
        const msg = String(errOrMsg?.message || errOrMsg || '').trim() || fallback;
        if (/accounts_relaunch_client.*not found|permission_denied.*accounts_relaunch_client/i.test(msg)) {
          return '后台 prism-files 插件进程还是旧版（尚未加载自动重启工具）；请先手动重启一次 Antigravity（或点顶部更新重启），重启后每次切号即可全自动重启生效。';
        }
        if (/凭据管理器调用失败:\s*exit 1\b/i.test(msg)) {
          return `${msg}（后台插件进程工作目录已过期，请在左侧「技能与自定义 → Plugins」将 prism-files 关闭重开一次或重载窗口后重试）`;
        }
        return msg;
      }

      async function executeAccountSwitchNow(targetId, saveSnapshot = true, autoRelaunch = true, autoCaptureUncaptured = true) {
        if (!targetId || appState.accounts.switching) return;
        stopCountdown(false);
        appState.accounts.switching = true;
        if (appState.accounts.countdown) appState.accounts.countdown.paused = true;
        setTopProgress(true);
        renderAccounts();
        try {
          const res = await callServerTool('accounts_switch', {
            targetId,
            dryRun: false,
            saveSnapshot,
            autoRelaunch: Boolean(autoRelaunch),
            autoCaptureUncaptured: Boolean(autoCaptureUncaptured),
            handoff: { cwd: appState.browse.dir || appState.homeDir || '' }
          });
          appState.accounts.countdown = null;
          appState.accounts.switching = false;
          setTopProgress(false);
          if (res && res.ok) {
            appState.accounts.lastSwitchResult = res;
            showToast(res.message || '账号凭据已安全切换');
            await loadAccountsTab({ forceRefresh: false });
          } else {
            showToast(formatAccountErrorMessage(res?.error, '切换失败'), true);
            renderAccounts();
          }
        } catch (err) {
          appState.accounts.switching = false;
          setTopProgress(false);
          showToast(formatAccountErrorMessage(err, '切换失败'), true);
          renderAccounts();
        }
      }

      function tickCountdownFrame() {
        const cd = appState.accounts.countdown;
        if (!cd) {
          stopCountdown(false);
          return;
        }
        if (cd.paused || appState.accounts.switching) {
          countdownRaf = null;
          return;
        }
        const remainMs = Math.max(0, cd.endAtMs - Date.now());
        if (remainMs <= 0) {
          executeAccountSwitchNow(cd.targetId, cd.saveSnapshot, cd.autoRelaunch, cd.autoCaptureUncaptured !== false);
          return;
        }
        const fillEl = document.getElementById('acc-cd-fill');
        const titleEl = document.getElementById('acc-cd-title');
        const remainSec = Math.ceil(remainMs / 1000);
        if (fillEl) {
          const pct = Math.max(0, Math.min(100, (remainMs / Math.max(1, cd.totalMs)) * 100));
          fillEl.style.width = `${pct.toFixed(2)}%`;
        }
        if (titleEl && remainSec !== countdownLastSec) {
          countdownLastSec = remainSec;
          titleEl.textContent = cd.autoRelaunch
            ? `⏱ 即将切换并重启至 ${cd.alias} (${remainSec}s)`
            : `⏱ 即将切换至 ${cd.alias} (${remainSec}s)`;
        }
        countdownRaf = requestAnimationFrame(tickCountdownFrame);
      }

      function startSwitchCountdown(account) {
        if (!account) return;
        stopCountdown(false);
        const totalSec = Math.max(3, Math.min(15, Number(appState.accounts.data?.countdownSeconds) || 5));
        const totalMs = totalSec * 1000;
        const autoRelaunch = appState.accounts.data?.autoRelaunchAfterSwitch !== false;
        appState.accounts.countdown = {
          targetId: account.id,
          email: account.email,
          alias: account.alias || account.email,
          totalSec,
          totalMs,
          endAtMs: Date.now() + totalMs,
          pausedRemainMs: totalMs,
          paused: false,
          saveSnapshot: true,
          autoRelaunch,
          autoCaptureUncaptured: true
        };
        countdownLastSec = totalSec;
        renderAccounts();
        countdownRaf = requestAnimationFrame(tickCountdownFrame);
      }

      function renderAccounts() {
        const st = appState.accounts;
        const d = st.data;
        if (d) {
          accountsVaultLabel.textContent = `凭据库: ${d.vault?.backend || '-'} (${d.vault?.ok ? '就绪' : '待检'})`;
          const act = d.activeCredential;
          accountsActivePill.textContent = act?.exists ? (act.email || '已登录(未含邮箱)') : '未检测到活跃凭据';
          accountsActivePill.className = `pill ${act?.exists ? 'pill-ok' : 'pill-warn'}`;
        }

        if (st.loading && !d) {
          accountsWrap.innerHTML = '<div class="empty-state">正在检测隔离凭据库与账号状态…</div>';
          return;
        }
        if (st.error && !d) {
          const isStaleServer = /not found|permission_denied|unknown tool/i.test(st.error);
          accountsWrap.innerHTML = isStaleServer
            ? `<article class="relay-card is-warn">` +
                `<div class="relay-card-head"><span class="relay-title">🔄 后台插件进程仍为旧版本</span><button type="button" class="mini-btn is-primary" data-acc-action="reload-tab">重新检测</button></div>` +
                `<p class="relay-sub">界面已更新到 v0.5.2，但当前驻留的 <code>prism-files</code> 插件后台还是热部署前启动的旧进程。</p>` +
                `<p class="relay-sub"><strong>生效方法：</strong>在 <strong>Plugins Manager</strong> 中把 <code>prism-files</code> 关闭再重新开启，或直接重启一次 Antigravity 即可恢复。</p>` +
                `<p class="relay-sub" style="opacity:0.78;">原始信息：<code>${escapeHtml(st.error)}</code></p>` +
              `</article>`
            : `<article class="relay-card is-warn">` +
                `<div class="relay-card-head"><span class="relay-title">读取账号状态失败</span><button type="button" class="mini-btn is-primary" data-acc-action="reload-tab">重试</button></div>` +
                `<p class="relay-sub">${escapeHtml(st.error)}</p>` +
              `</article>`;
          return;
        }

        const parts = [];
        if (!d || !d.enabled) {
          parts.push(
            '<article class="relay-card">' +
              '<div class="relay-card-head">' +
                '<span class="relay-title">🔒 主备多账号接力（默认关闭）</span>' +
                '<span class="pill">物理隔离</span>' +
              '</div>' +
              '<p class="relay-sub">1. <strong>绝不触碰本地会话</strong>：仅替换 OS 原生凭据库中的受验 OAuth 凭据，保留全部本地对话、SQLite、brain 产物与 workspace。<br>' +
              '2. <strong>零明文落盘</strong>：备份存入 Windows 凭据管理器 / macOS Keychain / Linux Secret Service 独立命名空间，元数据文件仅存邮箱与指纹前缀。<br>' +
              '3. <strong>防串号与原子回滚</strong>：切换前强核验 <code>id_token_email</code>，异常自动回滚原凭据。</p>' +
              '<div class="relay-form-row">' +
                '<button type="button" class="ctrl-btn is-primary" data-acc-action="enable">我已了解安全边界，开启账号接力</button>' +
                '<button type="button" class="ctrl-btn" data-acc-action="verify">仅只读校验本机隔离状态</button>' +
              '</div>' +
            '</article>'
          );
        } else {
          const rec = d.recommendation || {};
          if (d.activeCredential?.unregistered && d.activeCredential?.email) {
            parts.push(
              `<article class="relay-card is-warn">` +
                `<div class="relay-card-head"><span class="relay-title">🛡️ 检测到未捕获的新登录账号</span>` +
                `<button type="button" class="mini-btn is-primary" data-acc-action="capture-quick">立即备份该新号</button></div>` +
                `<p class="relay-sub">当前在线 <code>${escapeHtml(d.activeCredential.email)}</code> 尚未加入备份列表；直接切走其他账号时也会<strong>自动为其建立防丢备份槽位</strong>。</p>` +
              `</article>`
            );
          }
          if (rec.primaryRecovery) {
            parts.push(
              `<article class="relay-card is-accent">` +
                `<div class="relay-card-head"><span class="relay-title">💡 主号恢复提醒</span>` +
                `<button type="button" class="mini-btn is-primary" data-acc-action="countdown" data-id="${escapeHtml(rec.primaryRecovery.accountId)}">5s 倒计时切回主号</button></div>` +
                `<p class="relay-sub">${escapeHtml(rec.primaryRecovery.reason)}</p>` +
              `</article>`
            );
          }
          if (rec.crossFamilyHint) {
            parts.push(
              `<article class="relay-card is-warn"><p class="relay-sub">${escapeHtml(rec.crossFamilyHint)}</p></article>`
            );
          }

          if (st.countdown) {
            const cd = st.countdown;
            const remainMs = cd.paused
              ? (cd.pausedRemainMs ?? cd.totalMs)
              : Math.max(0, (cd.endAtMs || Date.now()) - Date.now());
            const remainSec = Math.ceil(remainMs / 1000);
            const pct = Math.max(0, Math.min(100, (remainMs / Math.max(1, cd.totalMs)) * 100));
            const cdActionLabel = cd.autoRelaunch ? '立即切换并重启' : '立即切换';
            parts.push(
              `<article class="relay-card is-warn">` +
                `<div class="relay-card-head">` +
                  `<span id="acc-cd-title" class="relay-title">${st.switching ? '⏳ 正在执行原子切换…' : (cd.autoRelaunch ? `⏱ 即将切换并重启至 ${escapeHtml(cd.alias)} (${remainSec}s)` : `⏱ 即将切换至 ${escapeHtml(cd.alias)} (${remainSec}s)`)}</span>` +
                  `<span class="pill">${escapeHtml(cd.email)}</span>` +
                `</div>` +
                `<div class="countdown-track"><div id="acc-cd-fill" class="countdown-fill" style="width:${pct.toFixed(2)}%"></div></div>` +
                `<div class="relay-form-row">` +
                  `<label style="font-size:11.5px;display:inline-flex;align-items:center;gap:4px;"><input type="checkbox" id="acc-cd-relaunch" ${cd.autoRelaunch ? 'checked' : ''}>切后自动重启 Antigravity</label>` +
                  `<label style="font-size:11.5px;display:inline-flex;align-items:center;gap:4px;"><input type="checkbox" id="acc-cd-snap" ${cd.saveSnapshot ? 'checked' : ''}>切前落盘 4 要素交接</label>` +
                `</div>` +
                `<div class="relay-form-row">` +
                  `<button type="button" class="mini-btn is-primary" data-acc-action="cd-now" ${st.switching ? 'disabled' : ''}>${cdActionLabel}</button>` +
                  `<button type="button" class="mini-btn" data-acc-action="cd-pause" ${st.switching ? 'disabled' : ''}>${cd.paused ? '继续' : '暂停'}</button>` +
                  `<button type="button" class="mini-btn" data-acc-action="cd-cancel" ${st.switching ? 'disabled' : ''}>取消</button>` +
                `</div>` +
              `</article>`
            );
          }

          if (st.lastSwitchResult) {
            const sw = st.lastSwitchResult;
            const autoStarted = Boolean(sw.relaunch?.ok && sw.relaunch?.scheduled);
            parts.push(
              `<article class="relay-card is-accent">` +
                `<div class="relay-card-head">` +
                  `<span class="relay-title">${autoStarted ? '🚀 凭据切换完成 · 正在自动重启 Antigravity…' : '🔄 凭据切换完成（需重启 Antigravity 生效）'}</span>` +
                  `<div class="search-card-actions">` +
                    (!autoStarted ? `<button type="button" class="mini-btn is-primary" data-acc-action="relaunch-now">🚀 立即重启 Antigravity 生效</button>` : '') +
                    `<button type="button" class="mini-btn" data-acc-action="dismiss-sw">收起</button>` +
                  `</div>` +
                `</div>` +
                `<p class="relay-sub">${escapeHtml(sw.message || '')}</p>` +
                `<div class="relay-form-row">` +
                  (sw.externalMemoryPrompt ? `<button type="button" class="mini-btn is-primary" data-acc-action="copy-ext-mem">复制外部 memory_store 同步指令</button>` : '') +
                  (sw.resumePrompt ? `<button type="button" class="mini-btn" data-acc-action="copy-resume">复制切后「接力」提示</button>` : '') +
                `</div>` +
              `</article>`
            );
          } else if (d?.pendingSwitch?.phase === 'active-swapped') {
            parts.push(
              `<article class="relay-card is-accent">` +
                `<div class="relay-card-head">` +
                  `<span class="relay-title">🔄 已切换至 ${escapeHtml(d.pendingSwitch.targetEmail || '目标账号')}（待重启生效）</span>` +
                  `<button type="button" class="mini-btn is-primary" data-acc-action="relaunch-now">🚀 立即重启 Antigravity 生效</button>` +
                `</div>` +
                `<p class="relay-sub">磁盘凭据已完成切换且会话记录 100% 保留，点右侧按钮将安全关闭并重开客户端，自动恢复扩展与原会话。</p>` +
              `</article>`
            );
          }

          const accs = Array.isArray(d.accounts) ? d.accounts : [];
          if (!accs.length) {
            parts.push('<div class="empty-state">尚未捕获账号，请先在下方点击「捕获当前活跃账号」把当前主号存入 OS 隔离凭据库</div>');
          } else {
            const fmtQuotaEta = (iso) => {
              if (!iso) return '';
              const ms = Date.parse(iso) - Date.now();
              if (!Number.isFinite(ms) || ms <= 0) return '';
              const mins = Math.ceil(ms / 60000);
              if (mins < 60) return `${mins}m 后重置`;
              const hrs = Math.floor(mins / 60);
              if (hrs < 48) return `${hrs}h${mins % 60 ? (mins % 60) + 'm' : ''} 后重置`;
              const days = Math.floor(hrs / 24);
              return `${days}d${hrs % 24 ? (hrs % 24) + 'h' : ''} 后重置`;
            };
            const barRow = (label, pct, passed, resetIso) => {
              if (pct === null || pct === undefined) return '';
              const n = Math.max(0, Math.min(100, Number(pct)));
              const cls = n >= 50 ? 'is-ok' : n >= 20 ? 'is-warn' : 'is-danger';
              const meta = passed
                ? '<span class="pill pill-ok">预计已满血 100%</span>'
                : `<span>${n}%${fmtQuotaEta(resetIso) ? ' · ' + escapeHtml(fmtQuotaEta(resetIso)) : ''}</span>`;
              return (
                `<div class="quota-bar-row">` +
                  `<strong>${label}</strong>` +
                  `<div class="quota-track"><div class="quota-fill ${cls}" style="width:${n}%"></div></div>` +
                  meta +
                `</div>`
              );
            };
            const autoRelaunchPref = d.autoRelaunchAfterSwitch !== false;
            const switchCtaText = autoRelaunchPref ? '⚡ 切换并重启' : '⏱ 5s 倒计时切号';
            for (const a of accs) {
              const roleBadge = a.role === 'primary'
                ? '<span class="pill pill-gold">★ 主账号</span>'
                : '<span class="pill">备用</span>';
              const activeBadge = a.isCurrentActive ? '<span class="pill pill-ok">● 当前在线</span>' : '';
              const backupBadge = a.vaultHasBackup ? '' : '<span class="pill pill-danger">缺备份</span>';
              const toggleRole = a.role === 'primary' ? 'backup' : 'primary';
              const toggleRoleText = a.role === 'primary' ? '改备用' : '设为主号';
              const eff = a.effectiveQuota;
              const q5Html = eff ? barRow('5h', eff.effective5hPct, eff.reset5hPassed, eff.reset5hAt) : '';
              const q7Html = eff ? barRow('7d', eff.effective7dPct, eff.reset7dPassed, eff.reset7dAt) : '';
              const famChips = [];
              if (eff?.families?.gemini) {
                const g = eff.families.gemini;
                const gBits = [];
                if (g.pct5h !== undefined) gBits.push(`5h ${g.pct5h}%`);
                if (g.pct7d !== undefined) gBits.push(`7d ${g.pct7d}%`);
                if (gBits.length) famChips.push(`<span class="quota-fam-chip"><strong>Gemini</strong> ${escapeHtml(gBits.join(' · '))}</span>`);
              }
              if (eff?.families?.claude) {
                const c = eff.families.claude;
                const cBits = [];
                if (c.pct5h !== undefined) cBits.push(`5h ${c.pct5h}%`);
                if (c.pct7d !== undefined) cBits.push(`7d ${c.pct7d}%`);
                if (cBits.length) famChips.push(`<span class="quota-fam-chip"><strong>Claude/GPT</strong> ${escapeHtml(cBits.join(' · '))}</span>`);
              }
              const obsIso = eff?.observedAt || eff?.updatedAt || '';
              const obsTime = obsIso ? (() => {
                const dt = new Date(obsIso);
                return Number.isFinite(dt.getTime())
                  ? `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`
                  : '';
              })() : '';
              const syncTag = obsTime
                ? `<span class="quota-fam-sync">${eff?.source === 'anti-claude-cache' ? '实时缓存' : '已同步'} ${escapeHtml(obsTime)}</span>`
                : '';
              const tierBadge = eff?.tierName ? `<span class="pill">${escapeHtml(eff.tierName)}</span>` : '';
              const quotaBlock = (q5Html || q7Html)
                ? `<div class="quota-bars">${q5Html}${q7Html}${(famChips.length || syncTag) ? `<div class="quota-fam-row">${famChips.join('')}${syncTag}</div>` : ''}</div>`
                : `<p class="relay-sub">${a.isCurrentActive ? '暂未读到本机实时额度缓存（点右上 ↻ 刷新，或点左下角「录入额度」手动补充）' : '切过去登录一次即自动记录实时额度与秒级重置倒计时（也可点左下角手动录入）'}</p>`;
              const isEditingQuota = st.editingQuotaId === a.id;
              const editorHtml = isEditingQuota
                ? `<div class="quota-editor" data-quota-editor="${escapeHtml(a.id)}">` +
                    `<div class="relay-form-row">` +
                      `<input type="number" min="0" max="100" class="text-input" style="max-width:86px;" id="qe-5h-${escapeHtml(a.id)}" placeholder="5h 剩余%" value="${eff?.effective5hPct ?? ''}" />` +
                      `<input type="number" min="0" max="100" class="text-input" style="max-width:86px;" id="qe-7d-${escapeHtml(a.id)}" placeholder="7d 剩余%" value="${eff?.effective7dPct ?? ''}" />` +
                      `<input type="number" min="0.1" step="0.5" class="text-input" style="max-width:96px;" id="qe-r5h-${escapeHtml(a.id)}" placeholder="5h 几h重置" />` +
                    `</div>` +
                    `<input type="text" class="text-input" id="qe-raw-${escapeHtml(a.id)}" placeholder="或直接粘贴额度文本（如 5h 剩余 80% 3h后重置；7d 剩余 45%）" />` +
                    `<div class="relay-form-row">` +
                      `<button type="button" class="mini-btn is-primary" data-acc-action="save-quota" data-id="${escapeHtml(a.id)}">保存额度</button>` +
                      `<button type="button" class="mini-btn" data-acc-action="cancel-quota">取消</button>` +
                    `</div>` +
                  `</div>`
                : '';
              parts.push(
                `<article class="relay-card${a.isCurrentActive ? ' is-online' : ''}">` +
                  `<div class="relay-card-head">` +
                    `<div class="search-card-meta">${roleBadge}${activeBadge}${tierBadge}${backupBadge}<span class="relay-title">${escapeHtml(a.alias || a.email)}</span></div>` +
                    `<div class="search-card-actions">` +
                      (!a.isCurrentActive ? `<button type="button" class="mini-btn is-primary" data-acc-action="countdown" data-id="${escapeHtml(a.id)}">${switchCtaText}</button>` : '') +
                    `</div>` +
                  `</div>` +
                  quotaBlock +
                  editorHtml +
                  `<p class="relay-sub"><code>${escapeHtml(a.email)}</code> · 指纹 <code>${escapeHtml(a.credHash || '-')}</code> · 最近使用 ${escapeHtml((a.lastUsedAt || '').slice(0, 16).replace('T', ' '))}</p>` +
                  `<div class="relay-card-foot">` +
                    `<div class="relay-foot-left">` +
                      (!a.isCurrentActive ? `<button type="button" class="mini-btn" data-acc-action="dryrun" data-id="${escapeHtml(a.id)}">预演</button>` : '') +
                      `<button type="button" class="mini-btn" data-acc-action="edit-quota" data-id="${escapeHtml(a.id)}">录入额度</button>` +
                      `<button type="button" class="mini-btn" data-acc-action="setrole" data-id="${escapeHtml(a.id)}" data-role="${toggleRole}">${toggleRoleText}</button>` +
                    `</div>` +
                    `<button type="button" class="mini-btn is-danger-subtle" data-acc-action="delete" data-id="${escapeHtml(a.id)}">删备份</button>` +
                  `</div>` +
                `</article>`
              );
            }
          }

          parts.push(
            '<article class="relay-card">' +
              '<div class="relay-card-head">' +
                '<span class="relay-title">捕获新账号与快捷操作</span>' +
                '<div class="relay-form-row">' +
                  '<button type="button" class="mini-btn" data-acc-action="snapshot">写交接快照</button>' +

              '</div>' +
              '<div class="relay-form-row">' +
                '<input id="acc-capture-alias" class="text-input" style="max-width:140px;" type="text" placeholder="别名（如 主号/备1）" />' +
                '<select id="acc-capture-role" class="relay-select" aria-label="账号角色">' +
                  '<option value="primary">设为主号 (Primary)</option>' +
                  '<option value="backup" selected>设为备用 (Backup)</option>' +
                '</select>' +
                '<button type="button" class="ctrl-btn is-primary" data-acc-action="capture">捕获当前活跃账号</button>' +
              '</div>' +
            '</article>'
          );

          const guideOpen = st.openSections?.guide || accs.length < 2;
          parts.push(
            `<details class="relay-accordion" data-sec="guide" ${guideOpen ? 'open' : ''}>` +
              `<summary>` +
                `<span>📖 如何添加主号与备用号（零输密码 · 3 步录入）</span>` +
                `<span class="relay-acc-summary-right"><span class="pill">${accs.length} 槽</span><span class="relay-acc-chevron" aria-hidden="true">▸</span></span>` +
              `</summary>` +
              `<div class="relay-acc-body">` +
                `<ol>` +
                  `<li><strong>捕获主号</strong>：保持当前主力账号登录状态 → 上方填别名（如 <code>主号</code>）、选「主号」→ 点 <strong>「捕获当前活跃账号」</strong>；</li>` +
                  `<li><strong>捕获备用号</strong>：去 Antigravity 设置切登录备用账号（全量会话与记录会自动保留），回来填别名选「备用」→ 再点一次 <strong>「捕获当前活跃账号」</strong>；</li>` +
                  `<li><strong>免登录一键切</strong>：录好主备号后，以后随时点卡片右上角 <strong>「⚡ 切换并重启」</strong> 即可安全切号并自动重启生效。</li>` +
                `</ol>` +
              `</div>` +
            `</details>`
          );

          const mems = st.memories || [];
          const memItemsHtml = mems.length
            ? mems.slice(0, 5).map((m, idx) =>
                `<div class="radar-item">` +
                  `<div class="relay-card-head">` +
                    `<span class="pill">${escapeHtml(m.slotTag || '')}</span>` +
                    `<div class="search-card-actions">` +
                      `<button type="button" class="mini-btn" data-acc-action="mem-copy-ext" data-idx="${idx}">同步外部Memory</button>` +
                      `<button type="button" class="mini-btn is-primary" data-acc-action="mem-copy-resume" data-idx="${idx}">复制接力</button>` +
                      `<button type="button" class="mini-btn is-danger-subtle" data-acc-action="mem-del" data-id="${escapeHtml(m.id)}">删除</button>` +
                    `</div>` +
                  `</div>` +
                  `<div>${escapeHtml(m.summary || '')}</div>` +
                  `<div class="relay-sub">下一步：${escapeHtml(m.nextAction || '-')}</div>` +
                `</div>`
              ).join('')
            : '<p class="relay-sub">暂无历史交接记忆；切号时勾选「切前落盘 4 要素交接」会自动记录。</p>';

          parts.push(
            `<details class="relay-accordion" data-sec="memories" ${st.openSections?.memories ? 'open' : ''}>` +
              `<summary>` +
                `<span>🧠 槽位交接记忆（按时间倒序 · 自动脱敏）</span>` +
                `<span class="relay-acc-summary-right"><span class="pill">${mems.length} 条</span><span class="relay-acc-chevron" aria-hidden="true">▸</span></span>` +
              `</summary>` +
              `<div class="relay-acc-body">${memItemsHtml}</div>` +
            `</details>`
          );
        }

        const rad = st.radarReport;
        let radarBodyHtml = '<p class="relay-sub">闭环顺序：① 只读侦察（不改代码） → ② 勾选想要融合的功能 → ③ 让 AI 融合后点「同步基线」归绿。</p>';
        if (st.radarLoading) {
          radarBodyHtml = '<p class="relay-sub">正在比对上游 Release 与关键路径变更…</p>';
        } else if (rad && Array.isArray(rad.results)) {
          radarBodyHtml = rad.results.map((r) => {
            const lvl = r.impactLevel === 'HIGH'
              ? '<span class="pill pill-danger">HIGH</span>'
              : r.impactLevel === 'MEDIUM'
                ? '<span class="pill pill-warn">MEDIUM</span>'
                : r.impactLevel === 'UP_TO_DATE'
                  ? '<span class="pill pill-ok">已同步</span>'
                  : `<span class="pill">${escapeHtml(r.impactLevel || '')}</span>`;
            const compatHtml = (r.compatFixes || []).length
              ? `<div style="margin-top:3px;"><strong style="font-size:11px;">兼容性 / 安全必看：</strong>` +
                r.compatFixes.map((c) =>
                  `<label class="radar-pick-row"><input type="checkbox" class="radar-pick-cb" checked data-key="${escapeHtml(r.key)}" data-repo="${escapeHtml(r.repo)}" data-sha="${escapeHtml(c.sha)}" data-msg="${escapeHtml(c.message)}"><span><code>${escapeHtml(c.sha)}</code> ${escapeHtml(c.message)}</span></label>`
                ).join('') + `</div>`
              : '';
            const featHtml = (r.featureCandidates || []).length
              ? `<div style="margin-top:3px;"><strong style="font-size:11px;">实用 / 有趣新功能候选：</strong>` +
                r.featureCandidates.map((c) =>
                  `<label class="radar-pick-row"><input type="checkbox" class="radar-pick-cb" data-key="${escapeHtml(r.key)}" data-repo="${escapeHtml(r.repo)}" data-sha="${escapeHtml(c.sha)}" data-msg="${escapeHtml(c.message)}"><span><code>${escapeHtml(c.sha)}</code> ${escapeHtml(c.message)}</span></label>`
                ).join('') + `</div>`
              : '';
            const rowActions = r.hasUpdate
              ? `<button type="button" class="mini-btn" data-acc-action="radar-copy-picked" data-key="${escapeHtml(r.key)}" data-repo="${escapeHtml(r.repo)}">复制已选融合指令</button>` +
                `<button type="button" class="mini-btn is-primary" data-acc-action="radar-sync-key" data-key="${escapeHtml(r.key)}">同步基线</button>`
              : '';
            return (
              `<div class="radar-item">` +
                `<div class="relay-card-head"><div class="search-card-meta"><strong>${escapeHtml(r.repo)}</strong>${lvl}</div><div class="search-card-actions">${rowActions}</div></div>` +
                `<div class="relay-sub">基线 ${escapeHtml(r.baselineTag || r.baselineCommit || '-')} → 最新 ${escapeHtml(r.latestTag || r.latestCommit || '-')} (${escapeHtml(r.license || '')})</div>` +
                compatHtml + featHtml +
              `</div>`
            );
          }).join('');
        }
        const radarBadge = st.radarLoading
          ? '<span class="pill">检查中</span>'
          : (rad?.summary?.high ? `<span class="pill pill-danger">HIGH ${rad.summary.high}</span>` : (rad ? '<span class="pill pill-ok">已侦察</span>' : '<span class="pill">待检</span>'));
        const radarOpen = Boolean(st.openSections?.radar || st.radarLoading || rad);
        parts.push(
          `<details class="relay-accordion" data-sec="radar" ${radarOpen ? 'open' : ''}>` +
            `<summary>` +
              `<span>🛰️ 上游更新雷达（先选功能再融合 · 同步归绿）</span>` +
              `<span class="relay-acc-summary-right">${radarBadge}<span class="relay-acc-chevron" aria-hidden="true">▸</span></span>` +
            `</summary>` +
            `<div class="relay-acc-body">` +
              `<div class="relay-card-head">` +
                `<span class="relay-sub">追踪上游更新并按兼容性/候选功能择优融合</span>` +
                `<div class="search-card-actions">` +
                  (rad?.markdown ? `<button type="button" class="mini-btn" data-acc-action="radar-copy">复制简报</button>` : '') +
                  `<button type="button" class="mini-btn is-primary" data-acc-action="radar-check" ${st.radarLoading ? 'disabled' : ''}>${st.radarLoading ? '检查中…' : '检查上游动向'}</button>` +
                `</div>` +
              `</div>` +
              radarBodyHtml +
            `</div>` +
          `</details>`
        );

        accountsWrap.innerHTML = parts.join('');
      }

      // Apply open_prism_files tool result
      function applyOpenToolResult(sc) {
        if (!sc || typeof sc !== 'object') return;
        if (sc.homeDir) appState.homeDir = sc.homeDir;
        if (sc.brainDir) appState.brainDir = sc.brainDir;
        if (sc.platformLabel) appState.platformLabel = sc.platformLabel;
        if (sc.state) {
          appState.prefs = {
            pinnedPaths: Array.isArray(sc.state.pinnedPaths) ? sc.state.pinnedPaths : [],
            lastPath: sc.state.lastPath || '',
            lastTab: RESTORABLE_TABS.includes(sc.state.lastTab) ? sc.state.lastTab : 'browse',
            showHidden: Boolean(sc.state.showHidden),
            doubleClickAction: sc.state.doubleClickAction === 'open_tab' ? 'open_tab' : 'reveal',
            allowLanSmb: Boolean(sc.state.allowLanSmb)
          };
        }
        if (sc.listing) {
          appState.browse.ok = sc.listing.ok !== false;
          appState.browse.error = sc.listing.error || '';
          appState.browse.dir = sc.listing.dir || '';
          appState.browse.parent = sc.listing.parent || '';
          appState.browse.total = Number(sc.listing.total) || 0;
          appState.browse.truncated = Boolean(sc.listing.truncated);
          appState.browse.entries = Array.isArray(sc.listing.entries) ? sc.listing.entries : [];
          if (!sc.listing.truncated && sc.listing.ok !== false && appState.browse.dir) {
            appState.browse.rawDir = appState.browse.dir;
            appState.browse.rawEntries = appState.browse.entries;
          }
          appState.browse.loading = false;
        }
        renderAll();
        if (typeof sc.warning === 'string' && sc.warning.trim()) {
          showToast(sc.warning.trim(), true);
        }
        if (sc.tab && ['browse', 'artifacts', 'pins', 'search', 'accounts'].includes(sc.tab) && !isExternalNavLocked()) {
          switchTab(sc.tab);
        }
        if (sc.selectFile) {
          appState.browse.selectedPath = sc.selectFile;
          renderBrowse();
          loadPreview(sc.selectFile);
        }
      }

      // Register message handler BEFORE calling ui/initialize
      window.addEventListener('message', (event) => {
        const msg = event.data;
        if (!msg || typeof msg !== 'object') return;

        // Sanitized bridge from main window Prism Suite extension (ping/pong, quota sync & focused tab switch)
        if (msg.__agPrismBridge === 'v1') {
          if (event.source && event.source !== window.parent && event.source !== window.top) return;
          const orig = String(event.origin || '').trim();
          const trustedOrig = !orig || orig === 'null' || orig === window.location.origin ||
            /^(?:app|vscode-webview|file):\/\//i.test(orig) ||
            /^https?:\/\/(?:127\.0\.0\.1|localhost)(?::\d+)?$/i.test(orig);
          if (!trustedOrig) return;
          if (msg.source && msg.source !== 'prism-suite') return;
          const replyWin = event.source || null;
          const replyOrigin = orig && orig !== 'null' ? orig : '*';

          if (msg.type === 'bridge-ping') {
            postBridgeToMain({
              type: 'bridge-pong',
              requestId: String(msg.requestId || ''),
              sessionId: String(msg.sessionId || ''),
              activeTab: appState.activeTab,
              initialized: Boolean(appState.initialized)
            }, replyWin, replyOrigin);
            return;
          }
          if (msg.type === 'init-sync') {
            if (msg.switchTab && ['browse', 'artifacts', 'pins', 'search', 'accounts'].includes(msg.switchTab)) {
              navigateFromExternalBridge(msg.switchTab, {
                intentId: String(msg.intentId || ''),
                requestId: String(msg.requestId || ''),
                sessionId: String(msg.sessionId || ''),
                focus: msg.focus !== false,
                replyWin,
                replyOrigin
              });
            }
            if (msg.quota) syncLiveQuotaFromMain(msg.quota);
          } else if (msg.type === 'quota-sync' && msg.quota) {
            syncLiveQuotaFromMain(msg.quota);
          } else if (msg.type === 'switch-tab') {
            navigateFromExternalBridge(msg.tab, {
              intentId: String(msg.intentId || ''),
              requestId: String(msg.requestId || ''),
              sessionId: String(msg.sessionId || ''),
              focus: msg.focus !== false,
              replyWin,
              replyOrigin
            });
          }
          return;
        }

        if (window.parent !== window && event.source && event.source !== window.parent) return;
        if (msg.jsonrpc !== '2.0') return;

        if (msg.id !== undefined && msg.id !== null && !msg.method) {
          const pending = pendingRequests.get(msg.id);
          if (!pending) return;
          pendingRequests.delete(msg.id);
          clearTimeout(pending.timer);
          if (msg.error) {
            const err = new Error(msg.error.message || 'RPC 调用错误');
            err.code = msg.error.code;
            err.data = msg.error.data;
            pending.reject(err);
          } else {
            pending.resolve(msg.result);
          }
          return;
        }

        if (msg.method && msg.id !== undefined && msg.id !== null) {
          if (msg.method === 'ping') {
            postToHost({ jsonrpc: '2.0', id: msg.id, result: {} });
          } else {
            postToHost({
              jsonrpc: '2.0',
              id: msg.id,
              error: { code: -32601, message: `Method not found: ${msg.method}` }
            });
          }
          return;
        }

        if (msg.method === 'ui/notifications/host-context-changed') {
          applyHostContext(msg.params);
        } else if (msg.method === 'ui/notifications/tool-input') {
          appState.hasToolInput = true;
          const args = msg.params?.arguments || msg.params || {};
          if (args.tab && ['browse', 'artifacts', 'pins', 'search', 'accounts'].includes(args.tab)) {
            switchTab(args.tab);
          }
        } else if (msg.method === 'ui/notifications/tool-result') {
          appState.hasToolResult = true;
          const sc = msg.params?.structuredContent || msg.params?.result?.structuredContent;
          applyOpenToolResult(sc);
        }
      }, { signal });

      // Topbar Events
      for (const btn of tabBtns) {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab, { persist: true }));
      }

      btnSmbToggle.addEventListener('click', async () => {
        const nextSmb = !appState.prefs.allowLanSmb;
        const ok = await persistPrefs({ allowLanSmb: nextSmb });
        if (ok) {
          showToast(
            nextSmb
              ? '已开启「允许局域网 NAS/SMB 路径」（仅放行私网/本地 UNC，拒绝公网）'
              : '已关闭「允许局域网 NAS/SMB 路径」'
          );
        }
      });

      btnHiddenToggle.addEventListener('click', async () => {
        const nextHidden = !appState.prefs.showHidden;
        const ok = await persistPrefs({ showHidden: nextHidden });
        if (ok) {
          showToast(nextHidden ? '已显示隐藏文件' : '已隐藏点文件');
          navigateToDir(appState.browse.dir, appState.browse.query);
        }
      });

      btnDblClickToggle.addEventListener('click', async () => {
        const nextAction = appState.prefs.doubleClickAction === 'open_tab' ? 'reveal' : 'open_tab';
        const ok = await persistPrefs({ doubleClickAction: nextAction });
        if (ok) {
          showToast(nextAction === 'open_tab' ? '双击默认动作：原生标签页打开' : `双击默认动作：在 ${appState.platformLabel || '系统目录'} 中定位`);
        }
      });

      btnRefresh.addEventListener('click', () => {
        btnRefresh.classList.remove('is-spinning');
        void btnRefresh.offsetWidth;
        btnRefresh.classList.add('is-spinning');
        if (appState.activeTab === 'browse') {
          navigateToDir(appState.browse.dir, appState.browse.query, { force: true });
          if (appState.preview.visible && appState.preview.data?.path && !appState.preview.dirty) {
            loadPreview(appState.preview.data.path, { force: true });
          }
        } else if (appState.activeTab === 'artifacts') {
          loadArtifacts();
        } else if (appState.activeTab === 'pins') {
          loadPins();
        } else if (appState.activeTab === 'search' && searchInput.value.trim()) {
          runTranscriptSearch();
        } else if (appState.activeTab === 'accounts') {
          loadAccountsTab({ forceRefresh: true });
        }
      });

      // Accounts Relay & Upstream Radar Event Delegation
      accountsWrap.addEventListener('toggle', (event) => {
        const det = event.target;
        if (det && det.matches && det.matches('details.relay-accordion[data-sec]')) {
          const sec = det.dataset.sec;
          if (sec && appState.accounts.openSections) {
            appState.accounts.openSections[sec] = Boolean(det.open);
          }
        }
      }, true);

      accountsWrap.addEventListener('change', (event) => {
        if (event.target && event.target.id === 'acc-cd-snap' && appState.accounts.countdown) {
          appState.accounts.countdown.saveSnapshot = Boolean(event.target.checked);
        } else if (event.target && event.target.id === 'acc-cd-relaunch' && appState.accounts.countdown) {
          const autoR = Boolean(event.target.checked);
          appState.accounts.countdown.autoRelaunch = autoR;
          if (appState.accounts.data) appState.accounts.data.autoRelaunchAfterSwitch = autoR;
          const nowBtn = accountsWrap.querySelector('button[data-acc-action="cd-now"]');
          if (nowBtn) nowBtn.textContent = autoR ? '立即切换并重启' : '立即切换';
          callServerTool('accounts_toggle_enabled', { autoRelaunchAfterSwitch: autoR }).catch(() => {});
        }
      });

      accountsWrap.addEventListener('click', async (event) => {
        const btn = event.target.closest('button[data-acc-action]');
        if (!btn) return;
        const act = btn.dataset.accAction;
        try {
          if (act === 'reload-tab') {
            await loadAccountsTab({ forceRefresh: true });
          } else if (act === 'enable') {
            await callServerTool('accounts_toggle_enabled', { enabled: true });
            showToast('已开启主备账号接力（绝不触碰会话库）');
            await loadAccountsTab({ forceRefresh: true });
          } else if (act === 'disable') {
            stopCountdown(false);
            await callServerTool('accounts_toggle_enabled', { enabled: false });
            showToast('已关闭账号接力模块');
            await loadAccountsTab({ forceRefresh: false });
          } else if (act === 'verify') {
            const res = await callServerTool('accounts_verify_integrity', {});
            showToast(`隔离校验正常 · brain 会话 ${res.brainSessionCount} · 后端 ${res.vaultBackend}`);
          } else if (act === 'relaunch-now') {
            btn.disabled = true;
            const res = await callServerTool('accounts_relaunch_client', { dryRun: false });
            btn.disabled = false;
            if (res?.ok && res?.scheduled) {
              showToast(res.message || '正在自动关闭并重开 Antigravity，请稍候…');
            } else {
              showToast(res?.error || '调度自动重启失败，请手动重启客户端', true);
            }
          } else if (act === 'capture' || act === 'capture-quick') {
            const aliasEl = document.getElementById('acc-capture-alias');
            const roleEl = document.getElementById('acc-capture-role');
            const res = await callServerTool('accounts_capture', {
              alias: act === 'capture-quick' ? '' : (aliasEl ? aliasEl.value.trim() : ''),
              role: act === 'capture-quick' ? 'backup' : (roleEl ? roleEl.value : 'backup')
            });
            if (res.ok) {
              showToast(`已捕获 ${res.account.alias} (${res.account.email})`);
              await loadAccountsTab({ forceRefresh: false });
            } else {
              showToast(res.error || '捕获失败', true);
            }
          } else if (act === 'snapshot') {
            const res = await callServerTool('accounts_save_snapshot', {
              cwd: appState.browse.dir || appState.homeDir || '',
              verifiedSummary: '手动触发切前 4 要素交接快照'
            });
            showToast(`已记录交接快照 ${res.snapshot?.slotTag || ''}`);
            await loadAccountsTab({ forceRefresh: false });
          } else if (act === 'countdown') {
            const id = btn.dataset.id;
            const acc = (appState.accounts.data?.accounts || []).find((a) => a.id === id);
            startSwitchCountdown(acc);
          } else if (act === 'cd-pause' && appState.accounts.countdown) {
            const cd = appState.accounts.countdown;
            if (!cd.paused) {
              cd.paused = true;
              cd.pausedRemainMs = Math.max(0, (cd.endAtMs || Date.now()) - Date.now());
              if (countdownRaf) {
                cancelAnimationFrame(countdownRaf);
                countdownRaf = null;
              }
            } else {
              cd.paused = false;
              cd.endAtMs = Date.now() + (cd.pausedRemainMs || cd.totalMs);
              countdownLastSec = -1;
              countdownRaf = requestAnimationFrame(tickCountdownFrame);
            }
            renderAccounts();
          } else if (act === 'cd-now' && appState.accounts.countdown) {
            const cd = appState.accounts.countdown;
            await executeAccountSwitchNow(cd.targetId, cd.saveSnapshot, cd.autoRelaunch, cd.autoCaptureUncaptured !== false);
          } else if (act === 'cd-cancel') {
            stopCountdown(true);
            showToast('已取消切号倒计时');
          } else if (act === 'dryrun') {
            const res = await callServerTool('accounts_switch', { targetId: btn.dataset.id, dryRun: true, autoCaptureUncaptured: true });
            showToast(res.ok ? res.message : formatAccountErrorMessage(res.error, '预演拦截'), !res.ok);
          } else if (act === 'edit-quota') {
            appState.accounts.editingQuotaId = appState.accounts.editingQuotaId === btn.dataset.id ? '' : btn.dataset.id;
            renderAccounts();
          } else if (act === 'cancel-quota') {
            appState.accounts.editingQuotaId = '';
            renderAccounts();
          } else if (act === 'save-quota') {
            const id = btn.dataset.id;
            const v5 = document.getElementById(`qe-5h-${id}`)?.value?.trim();
            const v7 = document.getElementById(`qe-7d-${id}`)?.value?.trim();
            const r5 = document.getElementById(`qe-r5h-${id}`)?.value?.trim();
            const raw = document.getElementById(`qe-raw-${id}`)?.value?.trim();
            const quota = {};
            if (v5 !== '' && v5 !== undefined) quota.window5hPct = Number(v5);
            if (v7 !== '' && v7 !== undefined) quota.window7dPct = Number(v7);
            if (r5 !== '' && r5 !== undefined && Number(r5) > 0) quota.reset5hInHours = Number(r5);
            if (raw) quota.rawText = raw;
            const res = await callServerTool('accounts_update', { accountId: id, quota });
            if (res.ok) {
              appState.accounts.editingQuotaId = '';
              showToast('已更新该账号额度快照');
              await loadAccountsTab();
            } else {
              showToast(res.error || '保存额度失败', true);
            }
          } else if (act === 'setrole') {
            const res = await callServerTool('accounts_update', { accountId: btn.dataset.id, role: btn.dataset.role });
            if (res.ok) {

      function getRowItem(listType, idx) {
        if (listType === 'browse') return appState.browse.entries[idx];

      async function handleListClick(event) {
        const actionBtn = event.target.closest('button[data-action]');
        const row = event.target.closest('.list-row');
        if (!row) return;
        const listType = row.dataset.list;
        const idx = Number(actionBtn ? actionBtn.dataset.index : row.dataset.index);
        const item = getRowItem(listType, idx);
        if (!item) return;

        if (actionBtn) {
          event.stopPropagation();
          const act = actionBtn.dataset.action;
          if (act === 'open') {
            openInNativeTab(item.uri);
          } else if (act === 'reveal') {
            revealPath(item.path);
          } else if (act === 'quote') {
            const ok = await attachContext(`@${item.path}`);
            if (ok) showToast('已引用路径到对话');
          } else if (act === 'jump') {
            switchTab('browse');
            filterInput.value = '';
            appState.browse.query = '';
            navigateToDir(item.path, '');
          } else if (act === 'unpin') {
            togglePinPath(item.path);
          }
          return;
        }

        // Row single click
        if (listType === 'browse') {
          appState.browse.selectedPath = item.path;
          renderBrowse();
          if (!item.isDir) loadPreview(item.path);
        } else if (listType === 'artifacts') {
          appState.artifacts.selectedPath = item.path;
          renderArtifacts();
          loadPreview(item.path);
        } else if (listType === 'pins') {
          appState.pins.selectedPath = item.path;
          renderPins();
          if (item.exists === false) {
            showToast('该路径已不存在，可点击移除', true);
            return;
          }
          if (!item.isDir) {
            loadPreview(item.path);
          }
        }
      }

      function handleListDblClick(event) {
        if (event.target.closest('button[data-action]')) {
          event.stopPropagation();
          return;
        }
        const row = event.target.closest('.list-row');
        if (!row) return;
        const listType = row.dataset.list;
        const idx = Number(row.dataset.index);
        const item = getRowItem(listType, idx);
        if (!item) return;

        if (listType === 'browse') {
          if (item.isDir) {
            filterInput.value = '';
            appState.browse.query = '';
            navigateToDir(item.path, '');
          } else if (appState.prefs.doubleClickAction === 'open_tab') {
            openInNativeTab(item.uri);
          } else {
            revealPath(item.path);
          }
        } else if (listType === 'artifacts') {
          revealPath(item.path);
        } else if (listType === 'pins') {

          }

            switchTab('browse');
            filterInput.value = '';
            appState.browse.query = '';

            if (event.shiftKey && pv.lineSelStart > 0) {

              pv.lineSelStart = 0;

            for (let i = 0; i < allLns.length; i++) {

        const btn = event.target.closest('button[data-placeholder-action]');

      previewResizer.addEventListener('pointerdown', (event) => {
        dragging = true;
        dragStartY = event.clientY;
        dragStartHeight = appState.preview.collapsed ? 220 : previewDrawer.getBoundingClientRect().height;
        previewDrawer.classList.add('is-resizing');
        previewResizer.setPointerCapture(event.pointerId);
      });

      previewResizer.addEventListener('pointermove', (event) => {
        if (!dragging) return;
        const delta = dragStartY - event.clientY;
        const maxH = Math.max(180, Math.floor(workspaceEl.getBoundingClientRect().height * 0.78));
        const nextH = Math.max(120, Math.min(maxH, Math.round(dragStartHeight + delta)));
        appState.preview.collapsed = false;
        appState.preview.height = nextH;
        previewDrawer.classList.remove('is-collapsed');
        previewDrawer.style.height = `${nextH}px`;
      });

      function stopDrag(event) {
        if (!dragging) return;
        dragging = false;
        previewDrawer.classList.remove('is-resizing');
        try {
          previewResizer.releasePointerCapture(event.pointerId);
        } catch {}
        renderPreviewHeaderOnly();
      }

      previewResizer.addEventListener('pointerup', stopDrag);
      previewResizer.addEventListener('pointercancel', stopDrag);
      previewResizer.addEventListener('dblclick', () => {
        appState.preview.collapsed = !appState.preview.collapsed;
        renderPreviewDrawer();
      });

      function isTypingFocus(el) {
        if (!el) return false;
        const tag = (el.tagName || '').toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
      }

      function isInteractiveControlFocus(el) {
        if (!el) return false;
        if (isTypingFocus(el)) return true;
        const tag = (el.tagName || '').toUpperCase();
        if (tag === 'BUTTON' || tag === 'A' || tag === 'SUMMARY') return true;
        const role = (el.getAttribute && el.getAttribute('role')) || '';
        return role === 'button' || role === 'tab' || role === 'menuitem' || role === 'link';
      }

      function stepActiveListSelection(delta) {
        const tab = appState.activeTab;
        if (tab === 'browse') {
          const items = appState.browse.entries;
          if (!items.length) return;
          const curIdx = items.findIndex((it) => it.path === appState.browse.selectedPath);
          const nextIdx = curIdx === -1
            ? (delta > 0 ? 0 : items.length - 1)
            : Math.max(0, Math.min(items.length - 1, curIdx + delta));
          appState.browse.selectedPath = items[nextIdx].path;
          renderBrowse();
          browseListWrap.querySelector('.list-row.is-selected')?.scrollIntoView({ block: 'nearest' });
        } else if (tab === 'artifacts') {
          const q = appState.artifacts.query.trim().toLowerCase();
          const items = q
            ? appState.artifacts.items.filter((it) => it.name.toLowerCase().includes(q) || (it.sessionId || '').toLowerCase().includes(q))
            : appState.artifacts.items;
          if (!items.length) return;
          const curIdx = items.findIndex((it) => it.path === appState.artifacts.selectedPath);
          const nextIdx = curIdx === -1
            ? (delta > 0 ? 0 : items.length - 1)
            : Math.max(0, Math.min(items.length - 1, curIdx + delta));
          appState.artifacts.selectedPath = items[nextIdx].path;
          renderArtifacts();
          artifactsListWrap.querySelector('.list-row.is-selected')?.scrollIntoView({ block: 'nearest' });
        } else if (tab === 'pins') {
          const items = appState.pins.items;
          if (!items.length) return;
          const curIdx = items.findIndex((it) => it.path === appState.pins.selectedPath);
          const nextIdx = curIdx === -1
            ? (delta > 0 ? 0 : items.length - 1)
            : Math.max(0, Math.min(items.length - 1, curIdx + delta));
          appState.pins.selectedPath = items[nextIdx].path;
          renderPins();
          pinsListWrap.querySelector('.list-row.is-selected')?.scrollIntoView({ block: 'nearest' });
        }
      }

      function activateSelectedListItem() {
        const tab = appState.activeTab;
        if (tab === 'browse') {
          const item = appState.browse.entries.find((it) => it.path === appState.browse.selectedPath);
          if (!item) return false;
          if (item.isDir) {
            filterInput.value = '';
            appState.browse.query = '';
            navigateToDir(item.path, '');
          } else {
            loadPreview(item.path);
          }
          return true;
        }
        if (tab === 'artifacts') {
          const item = appState.artifacts.items.find((it) => it.path === appState.artifacts.selectedPath);
          if (!item) return false;
          loadPreview(item.path);
          return true;
        }
        if (tab === 'pins') {
          const item = appState.pins.items.find((it) => it.path === appState.pins.selectedPath);
          if (!item || item.exists === false) return false;
          if (item.isDir) {
            switchTab('browse', { persist: true });
            filterInput.value = '';
            appState.browse.query = '';
            navigateToDir(item.path, '');
          } else {
            loadPreview(item.path);
          }
          return true;
        }
        return false;
      }

      // Global Shortcuts: Escape, Ctrl/Cmd+L, Ctrl/Cmd+S, and Keyboard Navigation (Up/Down/Enter/Backspace)
      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          if (appState.openTargets.menuOpen) {
            closeOpenWithMenu();
            return;
          }
          if (getLineRangeSelection()) {
            appState.preview.lineSelStart = 0;
            appState.preview.lineSelEnd = 0;
            previewBody.querySelectorAll('.code-ln.is-selected').forEach((n) => n.classList.remove('is-selected'));
            renderPreviewHeaderOnly();
            return;
          }
        }
        const mod = event.ctrlKey || event.metaKey;
        if (mod) {
          const key = event.key.toLowerCase();
          if (key === 'l') {
            event.preventDefault();
            if (appState.activeTab !== 'browse') switchTab('browse', { persist: true });
            enterPathEditMode();
          } else if (key === 's' && appState.preview.visible && appState.preview.editing) {
            event.preventDefault();
            saveEditedFile();
          }
          return;
        }
        if (event.altKey || appState.openTargets.menuOpen || appState.preview.editing || isTypingFocus(event.target)) return;
        if (appState.activeTab === 'browse' || appState.activeTab === 'artifacts' || appState.activeTab === 'pins') {
          if (event.key === 'ArrowDown') {
            event.preventDefault();
            stepActiveListSelection(1);
          } else if (event.key === 'ArrowUp') {
            event.preventDefault();
            stepActiveListSelection(-1);
          } else if (event.key === 'Enter' && !isInteractiveControlFocus(event.target)) {
            if (activateSelectedListItem()) event.preventDefault();
          } else if (event.key === 'Backspace' && !isInteractiveControlFocus(event.target) && appState.activeTab === 'browse' && appState.browse.parent) {
            event.preventDefault();
            filterInput.value = '';
            appState.browse.query = '';
            navigateToDir(appState.browse.parent, '');
          }
        }
      }, { signal });

      // Bootstrap & Initialize Handshake
      async function fallbackLoadIfNoToolResult() {
        if (appState.hasToolResult) return;
        try {
          const stateRes = await callServerTool('get_state', {});
          if (appState.hasToolResult) return;
          applyStateResult(stateRes);
          if (!bridgeSwitchApplied && !isExternalNavLocked() && RESTORABLE_TABS.includes(appState.prefs.lastTab) && appState.prefs.lastTab !== appState.activeTab) {
            switchTab(appState.prefs.lastTab, { persist: false });
          }
          await navigateToDir(appState.prefs.lastPath || appState.homeDir || '', '');
        } catch {}
      }

      async function bootstrap() {
        renderAll();
        if (!window.parent || window.parent === window) {
          appState.initialized = true;
          return;
        }
        try {
          const initRes = await sendRequest('ui/initialize', {
            protocolVersion: '2026-01-26',
            appInfo: { name: 'prism-files', version: '0.5.2' },
            appCapabilities: {}
          }, 12000);
          appState.hostCapabilities = initRes?.hostCapabilities || {};
          applyHostContext(initRes?.hostContext || {});
          appState.initialized = true;
          sendNotification('ui/notifications/initialized', {});
          postBridgeToMain({ type: 'ready' });
          renderAll();
          loadOpenTargets().catch(() => {});

          // Background warm sync of account summary for main-window Prism popover capsule
          setTimeout(() => {
            if (!appState.accounts.loaded && !appState.accounts.loading) {
              callServerTool('accounts_status', { forceRefresh: false })
                .then((st) => { if (st && st.ok) broadcastAccountSummary(st); })
                .catch(() => {});
            }
          }, 900);

          // Fallback when mounted directly as sidebar/aux pane without immediate tool-result
          setTimeout(() => {
            if (!appState.hasToolResult && !appState.hasToolInput) {
              fallbackLoadIfNoToolResult();
            }
          }, 250);
          setTimeout(() => {
            if (!appState.hasToolResult && !appState.browse.dir && !appState.browse.loading) {
              fallbackLoadIfNoToolResult();
            }
          }, 2200);
        } catch (err) {
          appState.initialized = true;
          showToast(err?.message || '初始化通信失败', true);
        }
      }

      bootstrap();
    })();
  </script>
</body>
</html>
